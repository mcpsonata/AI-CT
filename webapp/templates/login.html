<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Compliance Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
        }

        .login-body {
            padding: 40px 30px;
        }

        .login-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-info h2 {
            font-size: 22px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .login-info p {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
        }

        .microsoft-btn {
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .microsoft-btn:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }

        .microsoft-btn:active {
            transform: translateY(0);
        }

        .microsoft-icon {
            font-size: 24px;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 14px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .login-footer {
            text-align: center;
            padding: 20px 30px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }

        .login-footer p {
            font-size: 12px;
            color: #6b7280;
            margin: 0;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ecfdf5;
            color: #047857;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 20px;
        }

        .security-icon {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🤖 AI Compliance Tool</h1>
            <p>Empower the AI Certified Models with AI Power</p>
        </div>

        <div class="login-body">
            <div class="login-info">
                <h2>Welcome Back!</h2>
                <p>Please sign in with your Microsoft account to continue</p>
            </div>

            <div class="error-message" id="error-message">
                Authentication failed. Please try again.
            </div>

            <button class="microsoft-btn" id="login-btn" onclick="login()">
                <span class="microsoft-icon">🔐</span>
                <span>Sign in with Microsoft</span>
            </button>

            <div class="loading" id="loading">
                <span class="spinner"></span>
                <span>Authenticating...</span>
            </div>

            <div style="text-align: center;">
                <div class="security-badge">
                    <span class="security-icon">🔒</span>
                    <span>Secure Microsoft Authentication</span>
                </div>
            </div>
        </div>

        <div class="login-footer">
            <p>© 2025 AI Compliance Tool. All rights reserved.</p>
        </div>
    </div>

    <script>
        function login() {
            const loginBtn = document.getElementById('login-btn');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('error-message');

            // Hide error message
            errorMessage.classList.remove('active');
            
            // Show loading state
            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.6';
            loading.classList.add('active');

            // Redirect to Flask login endpoint
            window.location.href = '/login';
        }

        // Check for error parameter in URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            document.getElementById('error-message').classList.add('active');
            document.getElementById('error-message').textContent = 
                urlParams.get('error') || 'Authentication failed. Please try again.';
        }
    </script>
</body>
</html>
